# Deployment produksi: satu container app di belakang Caddy.
#
#   docker compose --env-file .env.production up -d --build
#
# Satu berkas env untuk keduanya: `--env-file` mengisi ${...} di bawah (build
# arg), `env_file:` mengirim isinya ke dalam container (rahasia runtime). Dua
# berkas terpisah akan menyimpan URL Supabase dua kali, dan salinan kedua itu
# yang akan menyimpang.
#
# Supabase TIDAK ada di sini — tetap di project hosted. Yang di-self-host cuma
# aplikasinya.

services:
  app:
    build:
      context: .
      args:
        # Diulang di sini karena NEXT_PUBLIC_* disulih saat BUILD, bukan saat run.
        # Menaruhnya hanya di `environment` akan menghasilkan bundle klien yang
        # menunjuk ke Supabase yang salah — dan itu baru ketahuan di browser.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_TAWK_PROPERTY_ID: ${NEXT_PUBLIC_TAWK_PROPERTY_ID:-}
        NEXT_PUBLIC_TAWK_WIDGET_ID: ${NEXT_PUBLIC_TAWK_WIDGET_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    # Tidak ada `ports:`. App hanya dijangkau Caddy lewat jaringan compose —
    # port 3000 yang terbuka ke internet berarti ada jalan memutari TLS.
    expose:
      - "3000"
    env_file:
      - .env.production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # QUIC/HTTP3
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat hidup di sini. Volume ini yang membuat restart tidak berarti
      # menerbitkan ulang semua sertifikat — dan penerbitan ulang massal adalah
      # cara tercepat menabrak rate limit Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
