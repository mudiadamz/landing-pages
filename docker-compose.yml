# Deployment produksi: Postgres, app, dan Caddy — semuanya di server ini.
#
#   docker compose --env-file .env.production up -d --build
#
# Satu berkas env untuk semuanya: `--env-file` mengisi ${...} di bawah (build
# arg & password database), `env_file:` mengirim isinya ke dalam container
# (rahasia runtime). Dua berkas terpisah akan menyimpan nilai yang sama dua
# kali, dan salinan kedua itu yang akan menyimpang.
#
# Urutan naik: db sehat → migrate (sekali jalan: db/migrations + login role
# app) sukses → app
# sehat → caddy. Deploy yang membawa migration gagal BERHENTI di migrate: app
# lama tetap jalan, app baru tidak pernah melihat skema setengah jadi.
#
# Tidak ada Supabase lagi (docs/plans/remove-supabase.md). Backup:
# scripts/backup.sh dari cron host.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env.production}
      POSTGRES_DB: lp
    # Tidak ada `ports:` — database hanya dijangkau container lain di jaringan
    # compose. Backup lewat `docker compose exec db pg_dump`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "lp"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Sekali jalan per deploy, sebagai PEMILIK database (bukan `app`): migration
  # membuat tabel dan memberi grant, aplikasi hanya membaca-menulis. Lalu
  # memberi role `app` password APP_DB_PASSWORD — setiap deploy, jadi volume
  # baru, volume lama, dan password yang diganti berakhir sama.
  migrate:
    image: lp-app
    build:
      context: .
      args: &build-args
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_TAWK_PROPERTY_ID: ${NEXT_PUBLIC_TAWK_PROPERTY_ID:-}
        NEXT_PUBLIC_TAWK_WIDGET_ID: ${NEXT_PUBLIC_TAWK_WIDGET_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    command: ["node", "scripts/migrate.mjs"]
    environment:
      MIGRATE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/lp
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?isi APP_DB_PASSWORD di .env.production}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    image: lp-app
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      # Diulang di sini karena NEXT_PUBLIC_* disulih saat BUILD, bukan saat run.
      # Menaruhnya hanya di `environment` akan menghasilkan bundle klien yang
      # menunjuk ke tempat yang salah — dan itu baru ketahuan di browser.
      args: *build-args
    restart: unless-stopped
    # Tidak ada `ports:`. App hanya dijangkau Caddy lewat jaringan compose —
    # port 3000 yang terbuka ke internet berarti ada jalan memutari TLS.
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      # Menimpa DATABASE_URL apa pun di .env.production: di server ini aplikasi
      # SELALU bicara ke container db, sebagai role `app`.
      DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@db:5432/lp
    volumes:
      # Semua file unggahan. Ini DATA, bukan cache: ikut dicadangkan bersama
      # database (docs/plans/remove-supabase.md).
      - storage:/srv/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # QUIC/HTTP3
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat hidup di sini. Volume ini yang membuat restart tidak berarti
      # menerbitkan ulang semua sertifikat — dan penerbitan ulang massal adalah
      # cara tercepat menabrak rate limit Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
