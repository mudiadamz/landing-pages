# The gate. Two jobs, because they need different things:
#
#   unit — typecheck + the pure suite. No Docker, seconds.
#   db   — one plain Postgres container, and tests/db against it: RLS, column
#          grants, triggers, auth, storage, and the schema contract. The suite
#          builds its own database from db/migrations on every run.
#
# The db job is the one that matters for migrations. The pure suite stayed
# green through a migration that broke every signup
# (docs/plans/test-before-leaving-supabase.md); only a real database noticed.
#
# `pnpm lint` is NOT a gate yet: it carries one pre-existing error in
# components/pdf-viewer.tsx. Add it here once that is fixed.

name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm version comes from package.json "packageManager".
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same image production runs (docker-compose.yml). No Supabase: the
    # point of this job since fase 4 of docs/plans/remove-supabase.md is that the
    # security model holds on Postgres alone.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
